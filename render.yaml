services:
  - type: web
    name: multipartes-el-tuerca
    env: docker
    region: ohio # us-east-2 (misma región AWS que Neon para latencia mínima)
    plan: free
    healthCheckPath: /up
    dockerContext: .
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Multipartes El Tuerca"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # Configurar con la clave generada en Render
      - key: APP_URL
        sync: false # Configurar con la URL generada por Render (https://multipartes-el-tuerca.onrender.com)
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: ep-rough-bird-b51mrxz3-pooler.c-7.us-east-2.aws.neon.tech
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_r5b3JRviQWpt
      - key: DB_SSLMODE
        value: require
      - key: AUTO_DEPLOY_SMARTDB
        value: "false"
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
